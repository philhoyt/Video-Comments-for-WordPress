name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1; next} found && (/^= [0-9]/ || /^== /){exit} found{print}" readme.txt > changelog_body.txt
          if [ ! -s changelog_body.txt ]; then
            echo "No changelog entry for ${VERSION} in readme.txt" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            video-comments.zip
            readme.txt
          body_path: changelog_body.txt
