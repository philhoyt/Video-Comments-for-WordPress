name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS and CSS
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint and analyse PHP
        run: |
          composer lint
          composer analyse -- --no-progress

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1; next} found && (/^= [0-9]/ || /^== /){exit} found{print}" readme.txt > changelog_body.txt
          if [ ! -s changelog_body.txt ]; then
            echo "No changelog entry for ${VERSION} in readme.txt" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Only the zip: the update checker reads readme.txt from the repository at the
          # tag, and a second asset makes it ambiguous which file is the package.
          files: video-comments.zip
          body_path: changelog_body.txt
